name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pruebas
        run: dotnet test tests/GestionCarp.Core.Tests -c Release

      - name: Publicar GestionCarp.exe (no requiere instalar .NET)
        run: >
          dotnet publish src/GestionCarp.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: GestionCarp-win-x64
          path: publish/GestionCarp.exe

      # En cada actualización de main se publica una versión descargable en "Releases".
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: GestionCarp 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descarga **GestionCarp.exe** y ábrelo. No necesita instalación.
            Si Windows muestra "Windows protegió su PC", pulsa "Más información" → "Ejecutar de todas formas".
          files: publish/GestionCarp.exe
